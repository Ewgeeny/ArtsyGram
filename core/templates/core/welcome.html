<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to ArtsyGram</title>
</head>
<body>
    <h1>Welcome to ArtsyGram</h1>

    <p>Discover and share creative inspiration.</p>

    <section>
        <h2>Log In</h2>

        <form method="post">
            {% csrf_token %}

            {{ login_form.as_p }}

            <button type="submit" name="login_submit">
                Log In
            </button>
        </form>
    </section>

    <section>
        <h2>Create Account</h2>

        <form method="post">
            {% csrf_token %}

            {{ register_form.as_p }}

            <button type="submit" name="register_submit">
                Register
            </button>
        </form>
    </section>
</body>
</html>
