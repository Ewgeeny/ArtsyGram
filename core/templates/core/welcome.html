<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to ArtsyGram</title>
</head>
<body>
    <h1>Welcome to ArtsyGram</h1>

    <p>Discover and share creative inspiration.</p>

    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <input type="submit" value="Log In">
    </form>
</body>
</html>
