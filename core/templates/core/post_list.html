{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtsyGram Posts</title>
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body>
    <main>
        <div class="page-header">
            <h1>All Posts</h1>
        </div>

        <form action="{% url 'post-list' %}" method="get" class="search-form">
            {{ filter_form.as_p }}
            <input type="submit" value="Filter">
        </form>

        {% if posts %}
            <ul>
                {% for post in posts %}
                    <li>
                        {{ post.title }} — {{ post.category.name }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="empty-state">
                <p>No posts found.</p>
            </div>
        {% endif %}
    </main>
</body>
</html>
