<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ArtsyGram Posts</title>
</head>
<body>
    <h1>All Posts</h1>

    <form action="{% url 'post-list' %}" method="get">
        {{ filter_form.as_p }}
        <input type="submit" value="Filter">
    </form>

    {% if posts %}
        <ul>
            {% for post in posts %}
                <li>
                    {{ post.title }} — {{ post.category.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No posts found.</p>
    {% endif %}
</body>
</html>
