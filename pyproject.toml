[project]
name = "artsygram"
version = "0.1.0"
description = "AI-powered social media application built with Django."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "django>=6.0.6",
    "pillow>=12.3.0",
    "uvicorn>=0.51.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pylint>=4.0.6",
    "pylint-django>=2.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.18",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "artsygram.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]
addopts = "--cov=. --cov-report=term-missing --cov-config=pyproject.toml"

[tool.coverage.run]
omit = [
    "artsygram/asgi.py",
    "artsygram/wsgi.py",
    "manage.py",
]

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "artsygram.settings"
ignore-paths = [
    "^core[\\\\/]migrations[\\\\/].*$",
]

[tool.pylint.messages_control]
disable = [
    "imported-auth-user",
    "invalid-str-returned",
]
